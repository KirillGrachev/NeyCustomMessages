# NeyCustomMessages - custom join, quit and death messages plus rotating
# announcements for every online player.
#
# PLACEHOLDERS - work in the module texts (chat format, title, subtitle,
# boss bar text):
#
#   Modules (join, quit, death)
#     {player}        name of the player the module fired for
#     {death_cause}   the vanilla death message (death module only)
#
#   Service (info, reload)
#     {version}       plugin version from plugin.yml
#     {time}          reload time, ms
#     {announcements} number of configured announcements
#     {interval}      announcement interval, seconds
#     {join}/{quit}/{death}/{permissions}
#                     state_on / state_off words for the matching switches
#     {announcements_state}  announcements.enabled as a state word
#     {count}         number of configured announcements
#     {mode}          random or round-robin
#     {prefix}        messages.prefix
#
# Announcements are delivered as-is to everyone: they have no player
# context, so {player} does not work inside them.
#
# HEX colors are supported everywhere: #RRGGBB and &#RRGGBB.
#
# Configs from 1.x keep working without edits: the top-level join/quit/death
# sections are read when modules.* is absent, announces.* is read as
# announcements.*, and the old key names (message, fadeIn, fadeOut,
# progress-decay, clickAction) are honored with a LEGACY_PATH console notice.

settings:

  enabled: true # Master switch. If false - modules stay silent, announcements stop

permissions:

  enabled: true # Enable the permission system for the /ncm command

  # Node of the /ncm command (reload, info)
  reload: "neycustommessages.reload"

# ─────────────────────────────────────────────────────────────
# Modules: join, quit and death. Every module delivers up to
# four outputs - chat, title, sound and boss bar - each with
# its own switch. A module with enabled: false leaves the
# vanilla message alone; an enabled module REPLACES it.
# ─────────────────────────────────────────────────────────────
modules:

  join:

    enabled: true

    chat:
      enabled: true
      format: "&a[+] &e{player} &7joined the server!"

    title:
      enabled: true
      title: "&aWelcome!"
      subtitle: "&e{player}"
      fade_in: 10   # ticks, 20 ticks = 1 second
      stay: 70
      fade_out: 20

    sound:
      enabled: true
      name: "ENTITY_PLAYER_LEVELUP"
      volume: 1.0
      pitch: 1.0

    bossbar:
      enabled: true
      text: "&aHello, {player}!"
      color: "GREEN"        # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      style: "SOLID"        # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
      duration: 5           # seconds on screen
      progress_decay: false # shrink the bar's progress over its duration

  quit:

    enabled: true

    chat:
      enabled: true
      format: "&c[-] &e{player} &7left the server."

    title:
      enabled: false
      title: "&cBye!"
      subtitle: "&7See you, {player}..."
      fade_in: 10
      stay: 50
      fade_out: 20

    sound:
      enabled: false
      name: "ENTITY_ENDERMAN_TELEPORT"
      volume: 0.8
      pitch: 0.9

    bossbar:
      enabled: true
      text: "&cGoodbye, {player}!"
      color: "BLUE"
      style: "SOLID"
      duration: 5
      progress_decay: false

  death:

    enabled: true

    chat:
      enabled: true
      format: "&4[☠] &e{player} &7died. Cause: {death_cause}"

    title:
      enabled: true
      title: "&4You died!"
      subtitle: "&7Cause: {death_cause}"
      fade_in: 5
      stay: 60
      fade_out: 15

    sound:
      enabled: true
      name: "ENTITY_GENERIC_EXPLODE"
      volume: 1.0
      pitch: 1.2

    bossbar:
      enabled: true
      text: "&4You died, {player}!"
      color: "RED"
      style: "SOLID"
      duration: 5
      progress_decay: false

# ─────────────────────────────────────────────────────────────
# Announcements: rotate through the list, every entry delivers
# the same four outputs to every online player. Chat entries
# support hover text and a click action.
# ─────────────────────────────────────────────────────────────
announcements:

  enabled: true
  interval: 15   # seconds between announcements (1 or more)
  random: true   # true - random order, false - round-robin

  list:

    announce_1:

      chat:
        enabled: true
        format: "&6[ANNOUNCEMENT] &eThe next event starts in 10 minutes!"
        hover: "&aClick to open the site\n&7https://t.me/NeyOff"
        click: "https://t.me/NeyOff"
        click_action: "OPEN_URL"   # OPEN_URL, RUN_COMMAND, SUGGEST_COMMAND

      title:
        enabled: true
        title: "&6Attention!"
        subtitle: "&eEvent coming soon!"
        fade_in: 10
        stay: 80
        fade_out: 20

      sound:
        enabled: true
        name: "BLOCK_NOTE_BLOCK_PLING"
        volume: 1.0
        pitch: 1.0

      bossbar:
        enabled: true
        text: "&6The event is about to start!"
        color: "YELLOW"
        style: "SOLID"
        duration: 8
        progress_decay: true

    announce_2:

      chat:
        enabled: false
        format: ""

      title:
        enabled: true
        title: "&dThanks for playing!"
        subtitle: "&7Support the server with a donation!"
        fade_in: 15
        stay: 100
        fade_out: 25

      sound:
        enabled: true
        name: "ENTITY_EXPERIENCE_ORB_PICKUP"
        volume: 0.7
        pitch: 1.5

      bossbar:
        enabled: false
        text: ""
        color: "YELLOW"
        style: "SOLID"
        duration: 8
        progress_decay: false

# ─────────────────────────────────────────────────────────────
# Service messages of the /ncm command
# ─────────────────────────────────────────────────────────────
messages:

  enabled: true # Master switch for the service messages below
  prefix: ""    # Substituted into {prefix} inside the texts (empty = no prefix)

  state_on:
    enabled: true
    text: "&aenabled"

  state_off:
    enabled: true
    text: "&cdisabled"

  no_permission:
    enabled: true
    text: "{prefix}&#ff6b6bYou do not have permission to do this."

  usage:
    enabled: true
    text:
      - "{prefix}&#8ce0ffNeyCustomMessages commands:"
      - "&f/ncm reload &8- &7reload the configuration"
      - "&f/ncm info &8- &7modules, announcements and permission state"

  reload:
    enabled: true
    text: "{prefix}&#9dff8cConfiguration reloaded &7({time} ms, {announcements} announcements, every {interval}s)."

  info:
    enabled: true
    text:
      - "{prefix}&7Version: &f{version}"
      - "&7Join: &f{join}"
      - "&7Quit: &f{quit}"
      - "&7Death: &f{death}"
      - "&7Announcements: &f{announcements_state} &8({count} configured, every {interval}s, {mode})"
      - "&7Permissions: &f{permissions}"
