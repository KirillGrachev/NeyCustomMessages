name: NeyCustomMessages
version: '${project.version}'
main: eu.neydev.custommessages.NeyCustomMessages
api-version: '1.20'
author: Ney
description: Custom join, quit, death messages and rotating announcements
website: https://t.me/NeyOff

commands:
  ncm:
    description: NeyCustomMessages control command
    usage: /ncm <reload|info>
    aliases: [neycustommessages]

permissions:
  neycustommessages.reload:
    description: Reload the configuration and read the current state
    default: op
  neycustommessages.admin:
    description: All NeyCustomMessages permissions
    default: op
    children:
      neycustommessages.reload: true
